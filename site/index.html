<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winston's Arcade</title>
    <meta name="description" content="A catalog of small browser games: 2048, Snake, Flappy Bird, Minesweeper, Sudoku, Memory, Hangman and Slots.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="shell.css">
</head>

<body data-game="shell">
    <div class="shell" id="shell">
        <aside class="side" id="side" aria-label="Arcade navigation">
            <div class="side-top">
                <a class="brand" href="#/"><span class="logo">🕹️</span><span class="label">Winston's Arcade</span></a>
                <button class="icon-btn collapse-btn" id="collapse" title="Collapse sidebar  [" aria-label="Collapse sidebar"></button>
            </div>
            <button class="search" id="openPalette" data-tip="Search  ⌘K"></button>
            <nav class="side-nav" id="nav"></nav>
            <div class="side-foot">
                <button class="side-link" id="sound"></button>
                <a class="side-link" href="../index.html" data-tip="Winston's links">
                    <span class="ico">👋</span><span class="label nm">Winston's links</span>
                </a>
            </div>
        </aside>
        <div class="scrim" id="scrim"></div>

        <div class="main">
            <header class="bar">
                <button class="icon-btn menu-btn" id="menu" aria-label="Open menu"></button>
                <div class="bar-title" id="barTitle"></div>
                <span class="spacer"></span>
                <div class="bar-actions" id="barActions"></div>
            </header>

            <section class="home" id="home"></section>

            <section class="play">
                <div class="frame-wrap" id="frameWrap">
                    <div class="loader" id="loader"></div>
                    <iframe id="frame" title="Game" allow="fullscreen; autoplay"></iframe>
                </div>
            </section>
        </div>
    </div>

    <div class="palette" id="palette" hidden>
        <div class="pal-box" role="dialog" aria-label="Jump to a game">
            <input id="palInput" placeholder="Jump to a game…" autocomplete="off" spellcheck="false">
            <ul class="pal-list" id="palList"></ul>
            <div class="pal-foot">↑ ↓ to move · Enter to play · Esc to close · [ toggles the sidebar</div>
        </div>
    </div>

    <script src="arcade.js"></script>
    <script>
        const A = Arcade;
        const GAMES = A.games;
        const $ = id => document.getElementById(id);

        const ICONS = {
            panel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path class="flip" d="M15.5 10l-2 2 2 2"/></svg>',
            search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
            home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
            star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>',
            prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
            next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
            full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
            reload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
            menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
            soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
            soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'
        };

        const shell = $('shell');
        const frame = $('frame');
        const frameWrap = $('frameWrap');
        let current = null;          // game on screen, or null for the catalog
        let filter = 'All';

        const cover = g => `<span class="cover" style="--accent:${g.accent}"><span class="cover-ico">${g.icon}</span></span>`;
        const statText = g => A.stat(g.id) ? A.fmt(A.stat(g.id)) : '—';

        function ago(time) {
            const minutes = Math.round((Date.now() - time) / 60000);
            if (minutes < 1) return 'just now';
            if (minutes < 60) return minutes + 'm ago';
            if (minutes < 1440) return Math.round(minutes / 60) + 'h ago';
            return Math.round(minutes / 1440) + 'd ago';
        }

        const recentGames = () => GAMES.filter(g => A.lastPlayed(g.id))
            .sort((a, b) => A.lastPlayed(b.id) - A.lastPlayed(a.id));

        // ---------- Sidebar ----------

        $('collapse').innerHTML = ICONS.panel;
        $('menu').innerHTML = ICONS.menu;
        $('openPalette').innerHTML = `${ICONS.search}<span class="label">Search games</span><kbd class="label">⌘K</kbd>`;

        function sideLink(g) {
            return `<a class="side-link${current === g ? ' active' : ''}" href="#/${g.id}" data-tip="${g.name}" style="--accent:${g.accent}">
                <span class="ico">${g.icon}</span><span class="label nm">${g.name}</span>
                <span class="label bd">${A.stat(g.id) ? A.fmt(A.stat(g.id)) : ''}</span></a>`;
        }

        function renderSide() {
            const favs = GAMES.filter(g => A.isFav(g.id));
            const groups = [];
            if (favs.length) groups.push(['Favorites', favs]);
            A.categories.forEach(c => groups.push([c, GAMES.filter(g => g.category === c)]));

            $('nav').innerHTML =
                `<a class="side-link${current ? '' : ' active'}" href="#/" data-tip="All games">
                    <span class="ico">${ICONS.home}</span><span class="label nm">All games</span></a>` +
                groups.map(([label, list]) =>
                    `<div class="side-section"><span class="label">${label}</span></div>` + list.map(sideLink).join('')).join('');

            const muted = A.muted();
            $('sound').innerHTML = `<span class="ico">${muted ? ICONS.soundOff : ICONS.soundOn}</span>
                <span class="label nm">Sound ${muted ? 'off' : 'on'}</span>`;
            $('sound').dataset.tip = muted ? 'Sound off' : 'Sound on';
        }

        function setCollapsed(value) {
            shell.classList.toggle('collapsed', value);
            $('collapse').setAttribute('aria-label', value ? 'Expand sidebar' : 'Collapse sidebar');
            $('collapse').title = (value ? 'Expand' : 'Collapse') + ' sidebar  [';
            A.setUi('collapsed', value);
        }

        function setDrawer(open) {
            shell.classList.toggle('nav-open', open);
        }

        function toggleSidebar() {
            if (window.matchMedia('(max-width: 860px)').matches) setDrawer(!shell.classList.contains('nav-open'));
            else setCollapsed(!shell.classList.contains('collapsed'));
        }

        // ---------- Top bar ----------

        function renderBar() {
            if (!current) {
                $('barTitle').innerHTML = `<div><b>All games</b><small>${GAMES.length} games · scores saved in this browser</small></div>`;
                $('barActions').innerHTML = `<button class="btn primary" id="surpriseBar">🎲 Surprise me</button>`;
                $('surpriseBar').addEventListener('click', surprise);
                return;
            }
            const g = current;
            const i = GAMES.indexOf(g);
            const prev = GAMES[(i - 1 + GAMES.length) % GAMES.length];
            const next = GAMES[(i + 1) % GAMES.length];
            const fav = A.isFav(g.id);
            $('barTitle').innerHTML = `<span class="bar-ico">${g.icon}</span>
                <div><b>${g.name}</b><small>${g.category} · ${g.tagline}</small></div>`;
            $('barActions').innerHTML = `
                <span class="chip-stat"><small>${g.stat}</small><b>${statText(g)}</b></span>
                <button class="icon-btn fav-btn" id="favBar" aria-pressed="${fav}" title="${fav ? 'Remove from' : 'Add to'} favorites">${ICONS.star}</button>
                <button class="icon-btn hide-sm" id="reload" title="Restart game">${ICONS.reload}</button>
                ${document.fullscreenEnabled ? `<button class="icon-btn hide-sm" id="full" title="Full screen">${ICONS.full}</button>` : ''}
                <a class="icon-btn hide-sm" href="#/${prev.id}" title="Previous: ${prev.name}">${ICONS.prev}</a>
                <a class="icon-btn hide-sm" href="#/${next.id}" title="Next: ${next.name}">${ICONS.next}</a>`;
            $('favBar').addEventListener('click', () => {
                A.toggleFav(g.id);
                refresh();
                focusGame();
            });
            $('reload').addEventListener('click', () => {
                loadFrame(A.url(g.file), true);
            });
            if ($('full')) $('full').addEventListener('click', () => frameWrap.requestFullscreen());
        }

        // ---------- Catalog ----------

        function renderHome() {
            const recent = recentGames();
            const star = recent[0];
            const heroGame = star || GAMES[0];

            const heroMain = star
                ? `<div class="hero-main" style="--accent:${star.accent}">
                        ${cover(star)}
                        <div>
                            <small>Continue playing</small>
                            <h1>${star.name}</h1>
                            <p>${star.tagline}</p>
                            <div class="hero-actions">
                                <a class="btn primary" href="#/${star.id}">▶ Play now</a>
                                <button class="btn" data-surprise>🎲 Surprise me</button>
                            </div>
                        </div>
                    </div>`
                : `<div class="hero-main" style="--accent:${heroGame.accent}">
                        <span class="cover" style="--accent:#a855f7"><span class="cover-ico">🕹️</span></span>
                        <div>
                            <small>Welcome</small>
                            <h1>Pick a game, any game</h1>
                            <p>${GAMES.length} small games that run right here. No sign-up, no ads, your scores stay in this browser.</p>
                            <div class="hero-actions">
                                <a class="btn primary" href="#/${heroGame.id}" style="--accent:${heroGame.accent}">▶ Start with ${heroGame.name}</a>
                                <button class="btn" data-surprise>🎲 Surprise me</button>
                            </div>
                        </div>
                    </div>`;

            const side = recent.length
                ? recent.slice(0, 4).map(g => `
                    <a class="mini" href="#/${g.id}" style="--accent:${g.accent}">${cover(g)}
                        <span><b>${g.name}</b><small>${g.stat}: ${statText(g)}</small></span>
                        <span class="when">${ago(A.lastPlayed(g.id))}</span></a>`).join('')
                : '<p class="empty">Games you play will show up here.</p>';

            const tabs = ['All', ...A.categories, '★ Favorites'];
            const shown = GAMES.filter(g =>
                filter === 'All' || g.category === filter || (filter === '★ Favorites' && A.isFav(g.id)));

            $('home').innerHTML = `<div class="home-inner">
                <section class="hero">
                    ${heroMain}
                    <div class="hero-side"><h2>Recently played</h2>${side}</div>
                </section>
                <section>
                    <div class="section-head">
                        <h2>Library</h2>
                        <div class="chips" id="chips">${tabs.map(t =>
                            `<button aria-pressed="${t === filter}">${t}</button>`).join('')}</div>
                    </div>
                    <div class="grid">${shown.map(card).join('') ||
                        '<p class="empty">No favorites yet — tap the star on any game.</p>'}</div>
                </section>
                <p class="foot-note">Made by Winston · <a href="../index.html">more links</a></p>
            </div>`;
        }

        function card(g) {
            const fav = A.isFav(g.id);
            return `<article class="card" style="--accent:${g.accent}">
                <div class="cover"><span class="cover-ico">${g.icon}</span><span class="tag">${g.category}</span></div>
                <button class="icon-btn fav-btn" data-fav="${g.id}" aria-pressed="${fav}"
                    aria-label="${fav ? 'Remove from' : 'Add to'} favorites">${ICONS.star}</button>
                <div class="card-body">
                    <h3><a class="card-link" href="#/${g.id}">${g.name}</a></h3>
                    <p>${g.tagline}</p>
                    <div class="card-foot">
                        <span><small>${g.stat}</small><b>${statText(g)}</b></span>
                        <span class="go">Play →</span>
                    </div>
                </div>
            </article>`;
        }

        $('home').addEventListener('click', e => {
            const favBtn = e.target.closest('[data-fav]');
            const chip = e.target.closest('#chips button');
            if (favBtn) {
                A.toggleFav(favBtn.dataset.fav);
                refresh();
            } else if (chip) {
                filter = chip.textContent;
                renderHome();
            } else if (e.target.closest('[data-surprise]')) {
                surprise();
            }
        });

        function surprise() {
            const pool = GAMES.filter(g => g !== current);
            location.hash = '#/' + pool[Math.floor(Math.random() * pool.length)].id;
        }

        // ---------- Game frame ----------

        function loadFrame(src, force) {
            if (!force && frame.dataset.src === src) return focusGame();
            frame.dataset.src = src;
            frameWrap.classList.add('loading');
            frame.src = src;
        }

        function focusGame() {
            if (current) frame.contentWindow.focus();
        }

        frame.addEventListener('load', () => {
            frameWrap.classList.remove('loading');
            focusGame();
        });

        // ---------- Routing ----------

        function route() {
            const id = location.hash.replace(/^#\/?/, '');
            current = GAMES.find(g => g.id === id) || null;
            shell.classList.toggle('in-game', !!current);
            document.documentElement.style.setProperty('--accent', current ? current.accent : '#a855f7');

            if (current) {
                document.title = current.name + " · Winston's Arcade";
                $('loader').innerHTML = `<span>${current.icon}</span>`;
                loadFrame(A.url(current.file));
            } else {
                document.title = "Winston's Arcade";
                // Unload the game so its loop and sounds stop while browsing.
                frame.dataset.src = '';
                frame.src = 'about:blank';
                renderHome();
                $('home').scrollTop = 0;
            }
            setDrawer(false);
            renderSide();
            renderBar();
        }

        // Stats changed (usually by the game in the iframe): repaint numbers.
        function refresh() {
            renderSide();
            renderBar();
            if (!current) renderHome();
        }

        // ---------- Quick switcher ----------

        let palItems = [];
        let palIndex = 0;

        function openPalette() {
            $('palette').hidden = false;
            $('palInput').value = '';
            filterPalette();
            $('palInput').focus();
        }

        function closePalette() {
            $('palette').hidden = true;
            focusGame();
        }

        function filterPalette() {
            const q = $('palInput').value.trim().toLowerCase();
            const home = { id: '', name: 'All games', icon: '🏠', accent: '#a855f7', category: 'Catalog', tagline: 'Back to the library' };
            palItems = [home, ...recentGames(), ...GAMES.filter(g => !A.lastPlayed(g.id))]
                .filter(g => !q || (g.name + ' ' + g.category + ' ' + g.tagline).toLowerCase().includes(q));
            palIndex = 0;
            paintPalette();
        }

        function paintPalette() {
            $('palList').innerHTML = palItems.map((g, i) => `
                <li class="${i === palIndex ? 'on' : ''}" data-i="${i}">${cover(g)}
                    <span><b>${g.name}</b><small>${g.tagline}</small></span><span class="kind">${g.category}</span></li>`).join('')
                || '<li class="empty">No games match.</li>';
            const on = $('palList').querySelector('.on');
            if (on) on.scrollIntoView({ block: 'nearest' });
        }

        function choose(i) {
            const g = palItems[i];
            if (!g) return;
            $('palette').hidden = true;
            location.hash = '#/' + g.id;
            focusGame();
        }

        $('palInput').addEventListener('input', filterPalette);
        $('palInput').addEventListener('keydown', e => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                const step = e.key === 'ArrowDown' ? 1 : -1;
                palIndex = (palIndex + step + palItems.length) % palItems.length;
                paintPalette();
            } else if (e.key === 'Enter') {
                choose(palIndex);
            }
        });
        $('palList').addEventListener('click', e => {
            const li = e.target.closest('li[data-i]');
            if (li) choose(+li.dataset.i);
        });
        $('palette').addEventListener('click', e => {
            if (e.target === $('palette')) closePalette();
        });

        // ---------- Wiring ----------

        $('collapse').addEventListener('click', () => setCollapsed(!shell.classList.contains('collapsed')));
        $('menu').addEventListener('click', () => setDrawer(true));
        $('scrim').addEventListener('click', () => setDrawer(false));
        $('openPalette').addEventListener('click', openPalette);
        $('sound').addEventListener('click', () => {
            A.setMuted(!A.muted());
            renderSide();
            A.sfx('tap');
        });

        function shortcut(key) {
            if (key === 'k') {
                if ($('palette').hidden) openPalette();
                else closePalette();
            } else if (key === '[') {
                toggleSidebar();
            }
        }

        document.addEventListener('keydown', e => {
            const typing = e.target.matches('input, textarea');
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                shortcut('k');
            } else if (e.key === '[' && !typing && !e.metaKey && !e.ctrlKey) {
                shortcut('[');
            } else if (e.key === 'Escape') {
                if (!$('palette').hidden) closePalette();
                setDrawer(false);
            }
        });

        // Shortcuts pressed while the game iframe has focus.
        window.addEventListener('message', e => {
            if (e.source === frame.contentWindow && e.data && e.data.arcade === 'key') shortcut(e.data.key);
        });

        A.onChange(refresh);
        window.addEventListener('hashchange', route);

        setCollapsed(!!A.ui('collapsed'));
        route();
    </script>
</body>

</html>
