<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Slots · Winston's Arcade</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .machine {
            width: min(100%, 380px, max(230px, calc(100dvh - 430px)));
            padding: 12px;
            border-radius: 22px;
            background: linear-gradient(160deg, #2a2f3d, #171a23);
            border: 1px solid var(--line-2);
            box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 22%, transparent);
        }

        .reels {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            container-type: inline-size;
        }

        .reel {
            position: relative;
            aspect-ratio: 1 / 3;
            overflow: hidden;
            border-radius: 14px;
            background: #0a0c11;
        }

        /* Soft shading at the top and bottom gives the reel a curved look. */
        .reel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.6), transparent 22%, transparent 78%, rgba(0, 0, 0, 0.6));
            pointer-events: none;
        }

        .strip {
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .sym {
            display: grid;
            place-items: center;
            aspect-ratio: 1;
            font-size: 17cqw;
            line-height: 1;
        }

        .sym.win {
            animation: win 0.5s ease 3;
            background: radial-gradient(circle, color-mix(in srgb, var(--accent) 45%, transparent), transparent 70%);
        }

        @keyframes win {
            50% {
                transform: scale(1.22);
            }
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .bet {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bet .stat {
            min-width: 76px;
            text-align: center;
        }

        .spin {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            border: 0;
            background: radial-gradient(circle at 35% 30%, #ff9aa8, var(--accent) 60%, #be123c);
            color: #2a0510;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow: 0 6px 0 #881337, 0 12px 26px rgba(251, 113, 133, 0.35);
            transition: transform 0.08s, box-shadow 0.08s;
            touch-action: manipulation;
        }

        .spin:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #881337;
        }

        .spin:disabled {
            filter: grayscale(0.7) brightness(0.7);
            cursor: default;
        }

        .msg {
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            text-align: center;
        }

        .msg.won {
            color: var(--accent);
        }

        .pays {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
            gap: 6px;
            width: 100%;
        }

        .pays div {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 9px;
            background: var(--panel-2);
            font-size: 13px;
        }

        .pays b {
            font-variant-numeric: tabular-nums;
        }

        .fine {
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body data-game="slot">
    <main>
        <div class="hud">
            <div class="stat hot"><span>Credits</span><b id="credits">0</b></div>
            <div class="stat"><span>Last win</span><b id="lastWin">0</b></div>
            <div class="stat"><span>Biggest win</span><b id="biggest">0</b></div>
        </div>

        <div class="stage">
            <div class="machine">
                <div class="reels" id="reels">
                    <div class="reel"><div class="strip"></div></div>
                    <div class="reel"><div class="strip"></div></div>
                    <div class="reel"><div class="strip"></div></div>
                </div>
            </div>

            <div class="controls">
                <div class="bet">
                    <button class="icon-btn" id="betDown" aria-label="Lower bet">−</button>
                    <div class="stat"><span>Bet</span><b id="bet">0</b></div>
                    <button class="icon-btn" id="betUp" aria-label="Raise bet">+</button>
                </div>
                <button class="spin" id="spin">SPIN</button>
                <button class="btn" id="auto">Auto: off</button>
            </div>

            <div class="msg" id="msg" aria-live="polite"></div>
            <div class="pays" id="pays"></div>
            <p class="fine">Payouts are multiples of your bet, per winning line. Five lines: three rows and both
                diagonals. Play money only.</p>
        </div>
    </main>

    <script src="../arcade.js"></script>
    <script>
        const A = Arcade;
        const BETS = [5, 10, 25, 50, 100];
        const START_CREDITS = 200;

        // weight = how many of each symbol are on a reel; pay = multiple of the bet for three on a line.
        // With five lines this returns roughly 96% of what is bet over the long run.
        const SYMBOLS = [
            { face: '🍒', weight: 7, pay: 2 },
            { face: '🍋', weight: 6, pay: 3 },
            { face: '🍊', weight: 5, pay: 5 },
            { face: '🍇', weight: 4, pay: 10 },
            { face: '🔔', weight: 3, pay: 20 },
            { face: '💎', weight: 2, pay: 50 },
            { face: '7️⃣', weight: 1, pay: 250 }
        ];
        const CHERRY = SYMBOLS[0];
        const TWO_CHERRY_PAY = 0.4;          // two cherries starting from the left reel
        const BIG_WIN = 20;                  // multiples of the bet that count as a big win

        // Each line lists which row to read on reel 1, 2 and 3.
        const LINES = [[0, 0, 0], [1, 1, 1], [2, 2, 2], [0, 1, 2], [2, 1, 0]];

        const BAG = SYMBOLS.flatMap(s => Array(s.weight).fill(s));
        const draw = () => BAG[Math.floor(Math.random() * BAG.length)];
        const cell = s => `<div class="sym">${s.face}</div>`;

        const strips = [...document.querySelectorAll('.strip')];
        const spinBtn = document.getElementById('spin');
        const autoBtn = document.getElementById('auto');
        const msgEl = document.getElementById('msg');

        const save = Object.assign({ credits: START_CREDITS, bet: 10 }, A.data('slot'));
        let showing = strips.map(() => [draw(), draw(), draw()]);   // [reel][row]
        let busy = false;
        let auto = false;
        let lastWin = 0;

        document.getElementById('pays').innerHTML =
            SYMBOLS.slice().reverse().map(s => `<div><span>${s.face.repeat(3)}</span><b>${s.pay}×</b></div>`).join('') +
            `<div><span>${CHERRY.face.repeat(2)}</span><b>${TWO_CHERRY_PAY}×</b></div>`;

        function paint() {
            document.getElementById('credits').textContent = A.fmt(save.credits);
            document.getElementById('bet').textContent = save.bet;
            document.getElementById('lastWin').textContent = A.fmt(lastWin);
            document.getElementById('biggest').textContent = A.fmt(A.stat('slot'));
            document.getElementById('betDown').disabled = busy || save.bet === BETS[0];
            document.getElementById('betUp').disabled = busy || save.bet === BETS[BETS.length - 1] ||
                BETS[BETS.indexOf(save.bet) + 1] > save.credits;
            spinBtn.disabled = busy || save.credits < save.bet;
            autoBtn.textContent = 'Auto: ' + (auto ? 'on' : 'off');
            autoBtn.classList.toggle('on', auto);
        }

        function say(text, won) {
            msgEl.className = 'msg' + (won ? ' won' : '');
            msgEl.textContent = text;
        }

        function changeBet(step) {
            const next = BETS[BETS.indexOf(save.bet) + step];
            if (busy || !next || next > Math.max(save.credits, BETS[0])) return;
            save.bet = next;
            A.saveData('slot', save);
            A.sfx('tap');
            paint();
        }

        function spin() {
            if (busy || A.modalOpen() || save.credits < save.bet) return;
            busy = true;
            save.credits -= save.bet;
            lastWin = 0;
            say('');
            paint();
            A.sfx('move');

            const result = strips.map(() => [draw(), draw(), draw()]);
            strips.forEach((strip, i) => {
                // The strip scrolls from the symbols on screen (bottom) up to the result (top).
                const cells = [...result[i], ...Array.from({ length: 14 + i * 8 }, draw), ...showing[i]];
                const seconds = 1 + i * 0.45;
                strip.innerHTML = cells.map(cell).join('');
                strip.style.transition = 'none';
                strip.style.transform = `translateY(${-(cells.length - 3) / cells.length * 100}%)`;
                void strip.offsetHeight;
                strip.style.transition = `transform ${seconds}s cubic-bezier(0.12, 0.75, 0.25, 1)`;
                strip.style.transform = 'translateY(0)';

                setTimeout(() => {
                    strip.style.transition = 'none';
                    strip.innerHTML = result[i].map(cell).join('');
                    A.sfx('tick');
                    if (i === strips.length - 1) settle(result);
                }, seconds * 1000 + 40);
            });
            showing = result;
        }

        function settle(result) {
            let win = 0;
            const hits = [];
            LINES.forEach(line => {
                const [a, b, c] = line.map((row, reel) => result[reel][row]);
                let pay = 0;
                let count = 0;
                if (a === b && b === c) {
                    pay = a.pay;
                    count = 3;
                } else if (a === CHERRY && b === CHERRY) {
                    pay = TWO_CHERRY_PAY;
                    count = 2;
                }
                if (!pay) return;
                win += Math.round(pay * save.bet);
                hits.push(a.face.repeat(count));
                line.slice(0, count).forEach((row, reel) => strips[reel].children[row].classList.add('win'));
            });

            busy = false;
            lastWin = win;
            save.credits += win;
            const big = win >= save.bet * BIG_WIN;

            if (win) {
                A.bump('slot', win);
                say(`${hits.join('  ')}   +${A.fmt(win)}`, true);
                A.sfx(big ? 'win' : 'good');
                if (big) {
                    A.confetti();
                    auto = false;
                }
            } else {
                say('No win — spin again');
            }

            // Drop the bet to whatever the remaining credits can cover.
            while (save.bet > save.credits && save.bet > BETS[0]) save.bet = BETS[BETS.indexOf(save.bet) - 1];
            A.saveData('slot', save);

            if (save.credits < BETS[0]) {
                auto = false;
                msgEl.className = 'msg';
                msgEl.innerHTML = `<span>Out of credits.</span>
                    <button class="btn primary" id="refill">Get ${START_CREDITS} free credits</button>`;
                document.getElementById('refill').addEventListener('click', () => {
                    save.credits = START_CREDITS;
                    save.bet = 10;
                    A.saveData('slot', save);
                    say('Topped up. Good luck!');
                    paint();
                });
            } else if (auto) {
                setTimeout(() => {
                    if (auto) spin();
                }, win ? 1500 : 650);
            }
            paint();
        }

        spinBtn.addEventListener('click', spin);
        document.getElementById('betDown').addEventListener('click', () => changeBet(-1));
        document.getElementById('betUp').addEventListener('click', () => changeBet(1));
        autoBtn.addEventListener('click', () => {
            auto = !auto;
            paint();
            if (auto) spin();
        });
        document.addEventListener('keydown', e => {
            if (e.code !== 'Space' || e.metaKey || e.ctrlKey || e.altKey || A.modalOpen()) return;
            e.preventDefault();
            if (!e.repeat) spin();
        });

        strips.forEach((strip, i) => strip.innerHTML = showing[i].map(cell).join(''));
        if (save.credits < BETS[0]) save.credits = START_CREDITS;
        if (!BETS.includes(save.bet) || save.bet > save.credits) save.bet = BETS[0];
        say('Match three on any line to win');
        paint();
    </script>
</body>

</html>
