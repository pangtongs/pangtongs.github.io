<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku · Winston's Arcade</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .stage {
            flex-direction: row;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: var(--board);
            aspect-ratio: 1;
            border: 2px solid var(--line-2);
            border-radius: 12px;
            overflow: hidden;
            container-type: inline-size;
            background: var(--panel-2);
        }

        .cell {
            display: grid;
            place-items: center;
            border: 0;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: none;
            color: var(--accent);
            font-size: 5.4cqw;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            min-width: 0;
        }

        .cell.br {
            border-right: 2px solid var(--line-2);
        }

        .cell.bb {
            border-bottom: 2px solid var(--line-2);
        }

        .cell.given {
            color: var(--text);
        }

        .cell.peer {
            background: rgba(255, 255, 255, 0.045);
        }

        .cell.same {
            background: color-mix(in srgb, var(--accent) 22%, transparent);
        }

        .cell.sel {
            background: color-mix(in srgb, var(--accent) 38%, transparent);
        }

        .cell.error {
            color: var(--bad);
            background: color-mix(in srgb, var(--bad) 18%, transparent);
        }

        .cell:focus-visible {
            outline-offset: -2px;
        }

        .notes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            padding: 6%;
            color: var(--muted);
            font-size: 2.3cqw;
            font-weight: 500;
            line-height: 1;
        }

        .notes i {
            display: grid;
            place-items: center;
            font-style: normal;
        }

        .side {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 210px;
        }

        .pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .pad button {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            border: 1px solid var(--line-2);
            background: var(--panel-2);
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }

        .pad button:hover:not(:disabled) {
            background: var(--panel-3);
        }

        .pad button:disabled {
            opacity: 0.25;
            cursor: default;
        }

        .pad small {
            position: absolute;
            right: 6px;
            bottom: 3px;
            font-size: 10px;
            color: var(--muted);
        }

        .tools {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .tools .btn {
            padding: 0 8px;
            font-size: 14px;
        }

        @media (max-width: 760px) {
            .side {
                width: var(--board);
            }

            .pad {
                grid-template-columns: repeat(9, 1fr);
                gap: 4px;
            }

            .pad button {
                aspect-ratio: 3 / 4;
                border-radius: 9px;
                font-size: 18px;
            }

            .pad small {
                display: none;
            }

            .tools {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body data-game="sudoku">
    <main>
        <div class="hud">
            <div class="stat hot"><span>Time</span><b id="time">0:00</b></div>
            <div class="stat"><span>Mistakes</span><b id="mistakes">0</b></div>
            <div class="stat"><span>Best</span><b id="best">—</b></div>
            <span class="spacer"></span>
            <div class="seg" id="levels" role="group" aria-label="Difficulty">
                <button data-level="easy">Easy</button>
                <button data-level="medium">Medium</button>
                <button data-level="hard">Hard</button>
            </div>
            <button class="btn primary" id="new">New puzzle</button>
        </div>

        <div class="stage">
            <div class="grid" id="grid" aria-label="Sudoku grid"></div>
            <div class="side">
                <div class="pad" id="pad"></div>
                <div class="tools">
                    <button class="btn" id="undo">↩ Undo</button>
                    <button class="btn" id="erase">⌫ Erase</button>
                    <button class="btn" id="notes">✏️ Notes</button>
                    <button class="btn" id="hint">💡 Hint</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../arcade.js"></script>
    <script>
        const A = Arcade;
        const CLUES = { easy: 42, medium: 34, hard: 28 };   // givens left on the board

        // ---------- Puzzle generation ----------

        // Every cell's 20 peers (same row, column or box).
        const PEERS = Array.from({ length: 81 }, (_, i) => {
            const r = Math.floor(i / 9), c = i % 9;
            const peers = [];
            for (let k = 0; k < 81; k++) {
                const r2 = Math.floor(k / 9), c2 = k % 9;
                const sameBox = Math.floor(r / 3) === Math.floor(r2 / 3) && Math.floor(c / 3) === Math.floor(c2 / 3);
                if (k !== i && (r === r2 || c === c2 || sameBox)) peers.push(k);
            }
            return peers;
        });
        const PEER_SETS = PEERS.map(list => new Set(list));

        function shuffle(list) {
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }
            return list;
        }

        function candidates(grid, i) {
            let used = 0;
            for (const p of PEERS[i]) used |= 1 << grid[p];
            const out = [];
            for (let d = 1; d <= 9; d++) if (!(used & (1 << d))) out.push(d);
            return out;
        }

        // The empty cell with the fewest options; trying it first keeps the search small.
        function tightestCell(grid) {
            let best = -1, options = null;
            for (let i = 0; i < 81; i++) {
                if (grid[i]) continue;
                const c = candidates(grid, i);
                if (!options || c.length < options.length) {
                    best = i;
                    options = c;
                    if (c.length <= 1) break;
                }
            }
            return [best, options];
        }

        function fill(grid) {
            const [i, options] = tightestCell(grid);
            if (i < 0) return true;
            for (const d of shuffle(options)) {
                grid[i] = d;
                if (fill(grid)) return true;
            }
            grid[i] = 0;
            return false;
        }

        // Counts solutions, stopping once `limit` are found.
        function countSolutions(grid, limit) {
            const [i, options] = tightestCell(grid);
            if (i < 0) return 1;
            let found = 0;
            for (const d of options) {
                grid[i] = d;
                found += countSolutions(grid, limit - found);
                if (found >= limit) break;
            }
            grid[i] = 0;
            return found;
        }

        function generate(level) {
            const solution = Array(81).fill(0);
            fill(solution);
            const puzzle = solution.slice();
            let filled = 81;
            // Remove cells one at a time, keeping a removal only if the puzzle still has one solution.
            for (const i of shuffle([...Array(81).keys()])) {
                if (filled <= CLUES[level]) break;
                const value = puzzle[i];
                puzzle[i] = 0;
                if (countSolutions(puzzle.slice(), 2) === 1) filled--;
                else puzzle[i] = value;
            }
            return { puzzle, solution };
        }

        // ---------- Game state ----------

        const gridEl = document.getElementById('grid');
        const padEl = document.getElementById('pad');
        const notesBtn = document.getElementById('notes');
        const undoBtn = document.getElementById('undo');

        const store = Object.assign({ level: 'medium', best: {}, game: null }, A.data('sudoku'));
        let S;                  // { level, puzzle, solution, values, notes, elapsed, mistakes, hints, done }
        let sel = -1;
        let notesMode = false;
        let undoStack = [];

        const cells = Array.from({ length: 81 }, (_, i) => {
            const r = Math.floor(i / 9), c = i % 9;
            const btn = document.createElement('button');
            btn.dataset.i = i;
            btn.dataset.edges = (c % 3 === 2 && c < 8 ? ' br' : '') + (r % 3 === 2 && r < 8 ? ' bb' : '');
            btn.setAttribute('aria-label', `Row ${r + 1}, column ${c + 1}`);
            gridEl.append(btn);
            return btn;
        });
        padEl.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-d="${d}">${d}<small></small></button>`).join('');

        function newGame(level) {
            store.level = level;
            S = Object.assign(generate(level), {
                level, notes: Array(81).fill(0), elapsed: 0, mistakes: 0, hints: 0, done: false
            });
            S.values = S.puzzle.slice();
            sel = -1;
            undoStack = [];
            persist();
            render();
        }

        function persist() {
            store.game = S;
            A.saveData('sudoku', store);
        }

        function render() {
            const selected = sel >= 0 ? S.values[sel] : 0;
            cells.forEach((btn, i) => {
                const v = S.values[i];
                let cls = 'cell' + btn.dataset.edges;
                if (S.puzzle[i]) cls += ' given';
                if (i === sel) cls += ' sel';
                else if (sel >= 0 && PEER_SETS[sel].has(i)) cls += ' peer';
                if (v && v === selected && i !== sel) cls += ' same';
                if (v && v !== S.solution[i]) cls += ' error';
                btn.className = cls;

                if (v) {
                    btn.textContent = v;
                } else if (S.notes[i]) {
                    btn.innerHTML = '<span class="notes">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d =>
                        `<i>${S.notes[i] & (1 << d) ? d : ''}</i>`).join('') + '</span>';
                } else {
                    btn.textContent = '';
                }
            });

            padEl.querySelectorAll('button').forEach(btn => {
                const d = +btn.dataset.d;
                const left = 9 - S.values.filter(v => v === d).length;
                btn.disabled = left <= 0 || S.done;
                btn.lastChild.textContent = left > 0 ? left : '';
            });

            document.getElementById('time').textContent = A.time(S.elapsed);
            document.getElementById('mistakes').textContent = S.mistakes;
            const best = store.best[S.level];
            document.getElementById('best').textContent = best ? A.time(best) : '—';
            document.querySelectorAll('#levels button').forEach(b =>
                b.setAttribute('aria-pressed', b.dataset.level === S.level));
            notesBtn.classList.toggle('on', notesMode);
            undoBtn.disabled = !undoStack.length || S.done;
        }

        const editable = i => i >= 0 && !S.done && !S.puzzle[i];

        function remember() {
            undoStack.push({ values: S.values.slice(), notes: S.notes.slice() });
            if (undoStack.length > 200) undoStack.shift();
        }

        function place(d) {
            if (!editable(sel)) return;
            if (notesMode) {
                if (S.values[sel]) return;
                remember();
                S.notes[sel] ^= 1 << d;
                A.sfx('tap');
            } else if (S.values[sel] === d) {
                remember();
                S.values[sel] = 0;
            } else {
                remember();
                S.values[sel] = d;
                S.notes[sel] = 0;
                if (d === S.solution[sel]) {
                    // A correct digit rules itself out of every peer's notes.
                    PEERS[sel].forEach(p => S.notes[p] &= ~(1 << d));
                    A.sfx('tap');
                } else {
                    S.mistakes++;
                    A.sfx('bad');
                }
            }
            afterChange();
        }

        function erase() {
            if (!editable(sel) || (!S.values[sel] && !S.notes[sel])) return;
            remember();
            S.values[sel] = 0;
            S.notes[sel] = 0;
            afterChange();
        }

        function undo() {
            if (!undoStack.length || S.done) return;
            const previous = undoStack.pop();
            S.values = previous.values;
            S.notes = previous.notes;
            afterChange();
        }

        function hint() {
            if (S.done) return;
            const wrong = i => S.values[i] !== S.solution[i];
            let target = sel >= 0 && !S.puzzle[sel] && wrong(sel) ? sel : -1;
            if (target < 0) {
                const open = [...Array(81).keys()].filter(wrong);
                target = open[Math.floor(Math.random() * open.length)];
            }
            remember();
            const d = S.solution[target];
            S.values[target] = d;
            S.notes[target] = 0;
            PEERS[target].forEach(p => S.notes[p] &= ~(1 << d));
            S.hints++;
            sel = target;
            A.sfx('good');
            afterChange();
        }

        function afterChange() {
            if (S.values.every((v, i) => v === S.solution[i])) {
                S.done = true;
                const best = store.best[S.level];
                const record = !best || S.elapsed < best;
                if (record) store.best[S.level] = S.elapsed;
                A.add('sudoku', 1);
                A.confetti();
                A.sfx('win');
                A.modal({
                    emoji: '🧩',
                    title: record ? 'Solved — new best time!' : 'Solved!',
                    text: S.hints ? `With ${S.hints} hint${S.hints > 1 ? 's' : ''}.` : 'No hints used.',
                    stats: [['Time', A.time(S.elapsed)], ['Mistakes', S.mistakes]],
                    actions: [{ label: 'New puzzle', primary: true, run: () => newGame(S.level) }]
                });
            }
            persist();
            render();
        }

        // ---------- Input ----------

        gridEl.addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            sel = +btn.dataset.i;
            render();
        });
        padEl.addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (btn) place(+btn.dataset.d);
        });
        undoBtn.addEventListener('click', undo);
        document.getElementById('erase').addEventListener('click', erase);
        document.getElementById('hint').addEventListener('click', hint);
        notesBtn.addEventListener('click', () => {
            notesMode = !notesMode;
            render();
        });
        document.getElementById('levels').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (btn && btn.dataset.level !== S.level) newGame(btn.dataset.level);
        });
        document.getElementById('new').addEventListener('click', () => newGame(S.level));

        const MOVES = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 };
        document.addEventListener('keydown', e => {
            if (A.modalOpen()) return;
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                return undo();
            }
            if (e.metaKey || e.ctrlKey || e.altKey) return;

            if (MOVES[e.key]) {
                e.preventDefault();
                if (sel < 0) {
                    sel = 40;
                } else {
                    const next = sel + MOVES[e.key];
                    // Left/right stay on the same row; up/down stay on the board.
                    const sameRow = Math.floor(next / 9) === Math.floor(sel / 9);
                    if (next >= 0 && next < 81 && (Math.abs(MOVES[e.key]) === 9 || sameRow)) sel = next;
                }
                cells[sel].focus();
                render();
            } else if (e.key >= '1' && e.key <= '9') {
                place(+e.key);
            } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
                erase();
            } else if (e.key.toLowerCase() === 'n') {
                notesMode = !notesMode;
                render();
            }
        });

        setInterval(() => {
            if (S.done || document.hidden || A.modalOpen()) return;
            S.elapsed++;
            document.getElementById('time').textContent = A.time(S.elapsed);
            if (S.elapsed % 5 === 0) persist();
        }, 1000);

        // Resume an unfinished puzzle, otherwise deal a fresh one.
        if (store.game && !store.game.done) {
            S = store.game;
            render();
        } else {
            newGame(store.level);
        }
    </script>
</body>

</html>
