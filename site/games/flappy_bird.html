<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird · Winston's Arcade</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        #canvas {
            display: block;
            width: min(100%, 360px, max(230px, calc((100dvh - 300px) * 2 / 3)));
            aspect-ratio: 2 / 3;
            border-radius: 16px;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body data-game="flappy">
    <main>
        <div class="hud">
            <div class="stat hot"><span>Score</span><b id="score">0</b></div>
            <div class="stat"><span>Best</span><b id="best">0</b></div>
            <span class="spacer"></span>
            <span class="how"><span class="kbd">Space</span> or tap to flap</span>
        </div>

        <div class="stage">
            <canvas id="canvas" aria-label="Flappy Bird playfield"></canvas>
        </div>
    </main>

    <script src="../arcade.js"></script>
    <script>
        const A = Arcade;

        // Logical playfield size; the canvas is scaled to fit by CSS.
        const W = 360;
        const H = 540;
        const GROUND = 64;
        const FLOOR = H - GROUND;
        const BIRD_X = 96;
        const BIRD_R = 13;
        const PIPE_W = 62;
        const PIPE_SPACING = 215;

        // Physics are per second, so the game runs the same on 60Hz and 120Hz screens.
        const GRAVITY = 1250;
        const FLAP = -370;
        const speedAt = score => Math.min(125 + score * 2.5, 200);   // px per second
        const gapAt = score => Math.max(165 - score * 1.5, 118);     // px between pipes

        const MEDALS = [[40, '💎', 'Diamond'], [25, '🥇', 'Gold'], [15, '🥈', 'Silver'], [7, '🥉', 'Bronze']];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');

        let mode;            // ready | play | dying | over
        let bird, pipes, score, scroll, clock;
        const clouds = Array.from({ length: 5 }, (_, i) => ({
            x: i * 90 + Math.random() * 40, y: 40 + Math.random() * 150, s: 0.7 + Math.random() * 0.6
        }));

        function reset() {
            mode = 'ready';
            bird = { y: H * 0.42, v: 0 };
            pipes = [];
            score = 0;
            scroll = 0;
            clock = 0;
            paintHud();
        }

        function paintHud() {
            scoreEl.textContent = score;
            bestEl.textContent = Math.max(A.stat('flappy'), score);
        }

        function flap() {
            if (A.modalOpen()) return;
            if (mode === 'ready') mode = 'play';
            if (mode !== 'play') return;
            bird.v = FLAP;
            A.sfx('tap');
        }

        function addPipe(x) {
            const gap = gapAt(score);
            const margin = 56;
            pipes.push({ x, gap, top: margin + Math.random() * (FLOOR - gap - margin * 2), scored: false });
        }

        function hitsRect(rx, ry, rw, rh) {
            const cx = Math.max(rx, Math.min(BIRD_X, rx + rw));
            const cy = Math.max(ry, Math.min(bird.y, ry + rh));
            return (BIRD_X - cx) ** 2 + (bird.y - cy) ** 2 < (BIRD_R - 2) ** 2;
        }

        function update(dt) {
            clock += dt;
            if (mode === 'ready') {
                bird.y = H * 0.42 + Math.sin(clock * 4) * 6;
                scroll += speedAt(0) * dt;
                return;
            }
            if (mode === 'over') return;

            bird.v += GRAVITY * dt;
            bird.y += bird.v * dt;

            if (mode === 'dying') {
                if (bird.y >= FLOOR - BIRD_R) {
                    bird.y = FLOOR - BIRD_R;
                    finish();
                }
                return;
            }

            if (bird.y < BIRD_R) {
                bird.y = BIRD_R;
                bird.v = 0;
            }

            const speed = speedAt(score);
            scroll += speed * dt;
            pipes.forEach(p => p.x -= speed * dt);
            pipes = pipes.filter(p => p.x > -PIPE_W - 10);
            if (!pipes.length) addPipe(W + 40);
            else if (pipes[pipes.length - 1].x < W - PIPE_SPACING) addPipe(pipes[pipes.length - 1].x + PIPE_SPACING);

            for (const p of pipes) {
                if (!p.scored && p.x + PIPE_W < BIRD_X) {
                    p.scored = true;
                    score++;
                    A.sfx('good');
                    paintHud();
                }
                if (hitsRect(p.x, -200, PIPE_W, p.top + 200) || hitsRect(p.x, p.top + p.gap, PIPE_W, FLOOR)) {
                    return crash();
                }
            }
            if (bird.y >= FLOOR - BIRD_R) {
                bird.y = FLOOR - BIRD_R;
                crash();
                finish();
            }
        }

        function crash() {
            mode = 'dying';
            bird.v = Math.min(bird.v, -160);
            A.sfx('bad');
        }

        function finish() {
            mode = 'over';
            const record = A.bump('flappy', score);
            const medal = MEDALS.find(m => score >= m[0]);
            if (record && score > 0) A.confetti();
            paintHud();
            A.modal({
                emoji: medal ? medal[1] : '🐦',
                title: record && score > 0 ? 'New best!' : 'Game over',
                text: medal ? medal[2] + ' medal' : 'Clear ' + MEDALS[MEDALS.length - 1][0] + ' pipes for a bronze medal.',
                stats: [['Score', score], ['Best', A.stat('flappy')]],
                actions: [{ label: 'Play again', primary: true, run: reset }]
            });
        }

        // ---------- Drawing ----------

        function mix(a, b, t) {
            return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
        }

        function drawPipe(x, y, h, capAtBottom) {
            const body = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
            body.addColorStop(0, '#2f9e44');
            body.addColorStop(0.35, '#69db7c');
            body.addColorStop(1, '#237a36');
            ctx.fillStyle = body;
            ctx.fillRect(x, y, PIPE_W, h);
            const capY = capAtBottom ? y + h - 22 : y;
            ctx.fillRect(x - 5, capY, PIPE_W + 10, 22);
            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, PIPE_W, h);
            ctx.strokeRect(x - 5, capY, PIPE_W + 10, 22);
        }

        function drawBird() {
            ctx.save();
            ctx.translate(BIRD_X, bird.y);
            ctx.rotate(mode === 'ready' ? 0 : Math.max(-0.45, Math.min(1.3, bird.v / 420)));

            ctx.fillStyle = '#ffd43b';
            ctx.strokeStyle = '#a66f00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 0, BIRD_R + 3, BIRD_R, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            const wing = mode === 'over' ? 0 : Math.sin(clock * 22) * 4;
            ctx.fillStyle = '#fff3bf';
            ctx.beginPath();
            ctx.ellipse(-5, 2 + wing, 8, 5, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(7, -5, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(8.5, -5, 2.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff922b';
            ctx.beginPath();
            ctx.moveTo(12, -1);
            ctx.lineTo(24, 3);
            ctx.lineTo(12, 7);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            // The sky drifts from day to dusk as the score climbs.
            const dusk = Math.min(score / 40, 1);
            const sky = ctx.createLinearGradient(0, 0, 0, FLOOR);
            sky.addColorStop(0, mix([56, 189, 248], [49, 46, 129], dusk));
            sky.addColorStop(1, mix([186, 230, 253], [251, 146, 60], dusk));
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, W, FLOOR);

            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            clouds.forEach(c => {
                const x = ((c.x - scroll * 0.15) % (W + 120) + W + 120) % (W + 120) - 60;
                ctx.beginPath();
                ctx.ellipse(x, c.y, 30 * c.s, 13 * c.s, 0, 0, Math.PI * 2);
                ctx.ellipse(x + 20 * c.s, c.y - 8 * c.s, 20 * c.s, 13 * c.s, 0, 0, Math.PI * 2);
                ctx.ellipse(x - 20 * c.s, c.y + 3 * c.s, 18 * c.s, 9 * c.s, 0, 0, Math.PI * 2);
                ctx.fill();
            });

            pipes.forEach(p => {
                drawPipe(p.x, -4, p.top + 4, true);
                drawPipe(p.x, p.top + p.gap, FLOOR - p.top - p.gap, false);
            });

            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, FLOOR, W, GROUND);
            ctx.fillStyle = '#74bf2e';
            ctx.fillRect(0, FLOOR, W, 14);
            ctx.fillStyle = '#5fa323';
            for (let x = -(scroll % 24); x < W; x += 24) {
                ctx.beginPath();
                ctx.moveTo(x, FLOOR + 14);
                ctx.lineTo(x + 12, FLOOR);
                ctx.lineTo(x + 24, FLOOR);
                ctx.lineTo(x + 12, FLOOR + 14);
                ctx.fill();
            }
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.fillRect(0, FLOOR - 2, W, 2);

            drawBird();

            ctx.textAlign = 'center';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'rgba(0,0,0,0.55)';
            ctx.fillStyle = '#fff';
            if (mode === 'ready') {
                ctx.font = '800 26px system-ui, sans-serif';
                ctx.lineWidth = 5;
                ctx.strokeText('Get ready', W / 2, 150);
                ctx.fillText('Get ready', W / 2, 150);
                ctx.font = '600 15px system-ui, sans-serif';
                ctx.lineWidth = 3;
                ctx.strokeText('Tap, click or press Space', W / 2, 178);
                ctx.fillText('Tap, click or press Space', W / 2, 178);
            } else {
                ctx.font = '800 46px system-ui, sans-serif';
                ctx.lineWidth = 6;
                ctx.strokeText(score, W / 2, 80);
                ctx.fillText(score, W / 2, 80);
            }
        }

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const scale = canvas.clientWidth / W * dpr;
            canvas.width = Math.round(W * scale);
            canvas.height = Math.round(H * scale);
            ctx.setTransform(scale, 0, 0, scale, 0, 0);
        }

        let last = 0;
        function loop(now) {
            // Cap the step so a background tab doesn't teleport the bird through a pipe.
            const dt = Math.min((now - last) / 1000, 1 / 30);
            last = now;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        // ---------- Input ----------

        document.addEventListener('keydown', e => {
            if (e.code !== 'Space' && e.key !== 'ArrowUp' && e.key.toLowerCase() !== 'w') return;
            if (e.metaKey || e.ctrlKey || e.altKey || A.modalOpen()) return;
            e.preventDefault();
            if (!e.repeat) flap();
        });
        canvas.addEventListener('pointerdown', e => {
            e.preventDefault();
            flap();
        });
        window.addEventListener('resize', resize);

        resize();
        reset();
        requestAnimationFrame(loop);
    </script>
</body>

</html>
