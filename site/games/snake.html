<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake · Winston's Arcade</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .field {
            position: relative;
            width: var(--board);
            aspect-ratio: 1;
        }

        .field canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            touch-action: none;
        }

        .cover {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            gap: 6px;
            border-radius: 16px;
            background: rgba(11, 13, 18, 0.72);
            text-align: center;
            pointer-events: none;
        }

        .cover b {
            font-size: 22px;
        }

        .cover span {
            color: var(--muted);
        }

        .cover[hidden] {
            display: none;
        }

        .dpad {
            display: none;
            grid-template-columns: repeat(3, 62px);
            grid-template-rows: repeat(2, 62px);
            gap: 8px;
        }

        .dpad button {
            border-radius: 16px;
            border: 1px solid var(--line-2);
            background: var(--panel-2);
            font-size: 22px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .dpad button:active {
            background: var(--accent);
            color: var(--accent-ink);
        }

        .dpad [data-dir='up'] {
            grid-column: 2;
        }

        .dpad [data-dir='left'] {
            grid-column: 1;
            grid-row: 2;
        }

        .dpad [data-dir='down'] {
            grid-column: 2;
            grid-row: 2;
        }

        .dpad [data-dir='right'] {
            grid-column: 3;
            grid-row: 2;
        }

        @media (pointer: coarse) {
            .dpad {
                display: grid;
            }
        }
    </style>
</head>

<body data-game="snake">
    <main>
        <div class="hud">
            <div class="stat hot"><span>Score</span><b id="score">0</b></div>
            <div class="stat"><span>Best</span><b id="best">0</b></div>
            <span class="spacer"></span>
            <div class="seg" id="speed" role="group" aria-label="Speed">
                <button data-speed="chill">Chill</button>
                <button data-speed="classic">Classic</button>
                <button data-speed="turbo">Turbo</button>
            </div>
            <button class="btn" id="walls" title="With walls on, hitting the edge ends the run">Walls: off</button>
            <button class="btn" id="pause">Pause</button>
        </div>

        <div class="stage">
            <div class="field">
                <canvas id="canvas" aria-label="Snake playfield"></canvas>
                <div class="cover" id="cover"><b id="coverTitle"></b><span id="coverText"></span></div>
            </div>
            <div class="dpad" id="dpad">
                <button data-dir="up" aria-label="Up">↑</button>
                <button data-dir="left" aria-label="Left">←</button>
                <button data-dir="down" aria-label="Down">↓</button>
                <button data-dir="right" aria-label="Right">→</button>
            </div>
        </div>
    </main>

    <script src="../arcade.js"></script>
    <script>
        const A = Arcade;
        const N = 20;                                  // cells per side
        const SPEEDS = { chill: 150, classic: 110, turbo: 75 };   // ms per step
        const BONUS_EVERY = 5;                         // foods between bonus stars
        const BONUS_LIFE = 45;                         // steps a star stays on the board
        const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const cover = document.getElementById('cover');
        const wallsBtn = document.getElementById('walls');
        const pauseBtn = document.getElementById('pause');

        const settings = Object.assign({ speed: 'classic', walls: false }, A.data('snake'));

        let snake, dir, queue, food, bonus, score, eaten, stepMs;
        let mode = 'ready';      // ready | playing | paused | over
        let sparks = [];
        let last = 0;
        let acc = 0;

        function reset() {
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            dir = DIRS.right;
            queue = [];
            score = 0;
            eaten = 0;
            bonus = null;
            sparks = [];
            stepMs = SPEEDS[settings.speed];
            placeFood();
            setMode('ready');
            paintHud();
        }

        function setMode(next) {
            mode = next;
            const text = {
                ready: ['Ready?', 'Press an arrow key or swipe to start'],
                paused: ['Paused', 'Press Space to resume']
            }[mode];
            cover.hidden = !text;
            if (text) {
                document.getElementById('coverTitle').textContent = text[0];
                document.getElementById('coverText').textContent = text[1];
            }
            pauseBtn.textContent = mode === 'paused' ? 'Resume' : 'Pause';
            pauseBtn.disabled = mode === 'ready' || mode === 'over';
        }

        function paintHud() {
            scoreEl.textContent = A.fmt(score);
            bestEl.textContent = A.fmt(Math.max(A.stat('snake'), score));
            wallsBtn.textContent = 'Walls: ' + (settings.walls ? 'on' : 'off');
            wallsBtn.classList.toggle('on', settings.walls);
            document.querySelectorAll('#speed button').forEach(b =>
                b.setAttribute('aria-pressed', b.dataset.speed === settings.speed));
        }

        function freeCell() {
            let cell;
            do {
                cell = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
            } while (snake.some(s => s.x === cell.x && s.y === cell.y) ||
                (food && food.x === cell.x && food.y === cell.y));
            return cell;
        }

        function placeFood() {
            food = null;
            food = freeCell();
        }

        function turn(name) {
            if (A.modalOpen() || mode === 'over' || mode === 'paused') return;
            const next = DIRS[name];
            // Compare with the last queued turn so two quick presses can't reverse the snake.
            const from = queue.length ? queue[queue.length - 1] : dir;
            if (next[0] === -from[0] && next[1] === -from[1]) return;
            if (mode === 'ready') setMode('playing');
            if (next !== from && queue.length < 3) queue.push(next);
        }

        function burst(cell, colour) {
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 0.12 + 0.04;
                sparks.push({
                    x: cell.x + 0.5, y: cell.y + 0.5,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, colour
                });
            }
        }

        function step() {
            if (queue.length) dir = queue.shift();
            let x = snake[0].x + dir[0];
            let y = snake[0].y + dir[1];

            if (settings.walls) {
                if (x < 0 || y < 0 || x >= N || y >= N) return die();
            } else {
                x = (x + N) % N;
                y = (y + N) % N;
            }

            const grows = x === food.x && y === food.y;
            // The tail cell is about to be vacated, so it only counts when growing.
            const body = grows ? snake : snake.slice(0, -1);
            if (body.some(s => s.x === x && s.y === y)) return die();

            snake.unshift({ x, y });
            if (grows) {
                score += 10;
                eaten++;
                burst(food, '#fb7185');
                A.sfx('good');
                placeFood();
                // Each bite makes the run slightly faster, down to 60% of the base delay.
                stepMs = Math.max(SPEEDS[settings.speed] * 0.6, stepMs - 2);
                if (eaten % BONUS_EVERY === 0) bonus = Object.assign(freeCell(), { life: BONUS_LIFE });
            } else {
                snake.pop();
            }

            if (bonus) {
                if (x === bonus.x && y === bonus.y) {
                    score += 50;
                    burst(bonus, '#fbbf24');
                    A.sfx('win');
                    bonus = null;
                } else if (--bonus.life <= 0) {
                    bonus = null;
                }
            }
            paintHud();
        }

        function die() {
            setMode('over');
            A.sfx('lose');
            const record = A.bump('snake', score);
            if (record) A.confetti();
            paintHud();
            A.modal({
                emoji: record ? '🏆' : '💥',
                title: record ? 'New best!' : 'Game over',
                stats: [['Score', A.fmt(score)], ['Length', snake.length], ['Best', A.fmt(A.stat('snake'))]],
                actions: [{ label: 'Play again', primary: true, run: reset }]
            });
        }

        // ---------- Drawing ----------

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = canvas.height = Math.round(canvas.clientWidth * dpr);
        }

        function draw(now) {
            const u = canvas.width / N;   // one cell in canvas pixels
            ctx.fillStyle = '#0f131a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255,255,255,0.025)';
            for (let y = 0; y < N; y++) {
                for (let x = (y % 2); x < N; x += 2) ctx.fillRect(x * u, y * u, u, u);
            }
            if (settings.walls) {
                ctx.strokeStyle = 'rgba(248,113,113,0.7)';
                ctx.lineWidth = u * 0.12;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);
            }

            // Food pulses gently.
            const pulse = 0.34 + Math.sin(now / 180) * 0.04;
            ctx.fillStyle = '#fb7185';
            ctx.shadowColor = '#fb7185';
            ctx.shadowBlur = u * 0.6;
            ctx.beginPath();
            ctx.arc((food.x + 0.5) * u, (food.y + 0.5) * u, u * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if (bonus) {
                ctx.globalAlpha = Math.min(1, bonus.life / 12);
                ctx.font = `${u * 0.9}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⭐', (bonus.x + 0.5) * u, (bonus.y + 0.55) * u);
                ctx.globalAlpha = 1;
            }

            // Body: one rounded stroke per segment pair, fading towards the tail.
            ctx.lineCap = 'round';
            ctx.lineWidth = u * 0.76;
            for (let i = snake.length - 1; i > 0; i--) {
                const a = snake[i];
                const b = snake[i - 1];
                const t = i / snake.length;
                ctx.strokeStyle = `hsl(${142 + t * 40}, 70%, ${58 - t * 22}%)`;
                ctx.beginPath();
                ctx.moveTo((a.x + 0.5) * u, (a.y + 0.5) * u);
                // Segments on opposite edges are joined by a wrap, not a line across the board.
                if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1) ctx.lineTo((b.x + 0.5) * u, (b.y + 0.5) * u);
                else ctx.lineTo((a.x + 0.5) * u, (a.y + 0.5) * u);
                ctx.stroke();
            }

            const head = snake[0];
            const hx = (head.x + 0.5) * u;
            const hy = (head.y + 0.5) * u;
            ctx.fillStyle = mode === 'over' ? '#f87171' : '#86efac';
            ctx.beginPath();
            ctx.arc(hx, hy, u * 0.46, 0, Math.PI * 2);
            ctx.fill();
            // Eyes sit to either side of the travel direction.
            ctx.fillStyle = '#0b0d12';
            for (const side of [-1, 1]) {
                ctx.beginPath();
                ctx.arc(hx + dir[0] * u * 0.16 - dir[1] * side * u * 0.18,
                    hy + dir[1] * u * 0.16 + dir[0] * side * u * 0.18, u * 0.08, 0, Math.PI * 2);
                ctx.fill();
            }

            sparks = sparks.filter(p => p.life > 0);
            sparks.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.colour;
                ctx.fillRect(p.x * u - u * 0.08, p.y * u - u * 0.08, u * 0.16, u * 0.16);
            });
            ctx.globalAlpha = 1;
        }

        function loop(now) {
            const dt = Math.min(now - last, 250);
            last = now;
            if (mode === 'playing') {
                acc += dt;
                while (acc >= stepMs && mode === 'playing') {
                    acc -= stepMs;
                    step();
                }
            } else {
                acc = 0;
            }
            draw(now);
            requestAnimationFrame(loop);
        }

        // ---------- Input ----------

        function togglePause() {
            if (mode === 'playing') setMode('paused');
            else if (mode === 'paused') setMode('playing');
        }

        const KEYS = {
            ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
            w: 'up', s: 'down', a: 'left', d: 'right'
        };
        document.addEventListener('keydown', e => {
            if (e.metaKey || e.ctrlKey || e.altKey || A.modalOpen()) return;
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            if (key === ' ' || key === 'p') {
                e.preventDefault();
                togglePause();
            } else if (KEYS[key]) {
                e.preventDefault();
                turn(KEYS[key]);
            }
        });

        // Swipe: every 18px of travel counts as a turn, so one drag can steer repeatedly.
        let origin = null;
        canvas.addEventListener('pointerdown', e => {
            origin = { x: e.clientX, y: e.clientY };
            canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener('pointermove', e => {
            if (!origin) return;
            const dx = e.clientX - origin.x;
            const dy = e.clientY - origin.y;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
            turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
            origin = { x: e.clientX, y: e.clientY };
        });
        canvas.addEventListener('pointerup', () => origin = null);
        canvas.addEventListener('pointercancel', () => origin = null);

        document.getElementById('dpad').addEventListener('pointerdown', e => {
            const btn = e.target.closest('button');
            if (btn) turn(btn.dataset.dir);
        });

        document.getElementById('speed').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            settings.speed = btn.dataset.speed;
            A.saveData('snake', settings);
            reset();
        });
        wallsBtn.addEventListener('click', () => {
            settings.walls = !settings.walls;
            A.saveData('snake', settings);
            reset();
        });
        pauseBtn.addEventListener('click', togglePause);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && mode === 'playing') setMode('paused');
        });
        window.addEventListener('resize', resize);

        resize();
        reset();
        requestAnimationFrame(loop);
    </script>
</body>

</html>
