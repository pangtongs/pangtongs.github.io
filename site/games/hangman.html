<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman - My Games</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .hangman-container {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        #hangman-drawing {
            font-family: monospace;
            white-space: pre;
            margin: 20px;
            font-size: 1.2em;
            color: #ffffff;
        }

        #word-display {
            font-size: 2em;
            letter-spacing: 0.2em;
            margin: 20px;
            color: #ffffff;
        }

        #guesses {
            margin: 20px;
        }

        #guess-input {
            font-size: 1.2em;
            width: 50px;
            text-align: center;
            margin-right: 10px;
            padding: 5px;
            border: 2px solid #4CAF50;
            border-radius: 5px;
        }

        .hangman-container button {
            font-size: 1.2em;
            padding: 8px 20px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .hangman-container button:hover {
            background-color: #45a049;
        }

        #message {
            margin: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd700;
        }

        #used-letters {
            margin: 10px;
            color: #cccccc;
        }

        .used-letter {
            text-decoration: line-through;
            color: #ff6b6b;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <!-- Sidebar content will be inserted here by JavaScript -->
    </div>

    <main class="main-content">
        <div class="game-container">
            <div class="hangman-container">
                <h1>Hangman Game</h1>
                <div id="hangman-drawing"></div>
                <div id="word-display"></div>
                <div id="guesses">
                    <input type="text" id="guess-input" maxlength="1">
                    <button onclick="makeGuess()">Guess</button>
                </div>
                <div id="message"></div>
                <div id="used-letters"></div>
            </div>
        </div>
    </main>

    <script src="sidebar.js"></script>
    <script>
        const words = [
            'JAVASCRIPT', 'HANGMAN', 'GAME', 'PROGRAMMING', 'COMPUTER', 'WEB', 'DEVELOPMENT',
            'ALGORITHM', 'DATABASE', 'NETWORK', 'SECURITY', 'INTERFACE', 'FUNCTION', 'VARIABLE',
            'BROWSER', 'SERVER', 'CLOUD', 'FRAMEWORK', 'LIBRARY', 'OBJECT', 'METHOD', 'ARRAY',
            'STRING', 'INTEGER', 'BOOLEAN', 'SYNTAX', 'DEBUGGING', 'FRONTEND', 'BACKEND',
            'RESPONSIVE', 'MOBILE', 'DESKTOP', 'APPLICATION', 'SOFTWARE', 'HARDWARE', 'KEYBOARD',
            'MONITOR', 'MOUSE', 'PROCESSOR', 'MEMORY', 'STORAGE', 'ENCRYPTION', 'AUTHENTICATION',
            'AUTHORIZATION', 'COOKIE', 'SESSION', 'CACHE', 'PROTOCOL', 'DOMAIN', 'HOSTING'
        ];
        let word = '';
        let guessedLetters = [];
        let remainingGuesses = 6;

        const hangmanStages = [
            `
  +---+
  |   |
      |
      |
      |
      |
=========`,
            `
  +---+
  |   |
  O   |
      |
      |
      |
=========`,
            `
  +---+
  |   |
  O   |
  |   |
      |
      |
=========`,
            `
  +---+
  |   |
  O   |
 /|   |
      |
      |
=========`,
            `
  +---+
  |   |
  O   |
 /|\\  |
      |
      |
=========`,
            `
  +---+
  |   |
  O   |
 /|\\  |
 /    |
      |
=========`,
            `
  +---+
  |   |
  O   |
 /|\\  |
 / \\  |
      |
=========`
        ];

        function initializeGame() {
            word = words[Math.floor(Math.random() * words.length)];
            guessedLetters = [];
            remainingGuesses = 6;
            updateDisplay();
            document.getElementById('message').textContent = '';
            document.getElementById('guess-input').value = '';
        }

        function updateDisplay() {
            // Update word display
            const wordDisplay = word
                .split('')
                .map(letter => guessedLetters.includes(letter) ? letter : '_')
                .join(' ');
            document.getElementById('word-display').textContent = wordDisplay;

            // Update hangman drawing
            document.getElementById('hangman-drawing').textContent = hangmanStages[6 - remainingGuesses];

            // Update used letters
            document.getElementById('used-letters').textContent = 'Used letters: ' +
                guessedLetters.join(', ');
        }

        function makeGuess() {
            const input = document.getElementById('guess-input');
            const guess = input.value.toUpperCase();
            input.value = '';

            if (guess.length !== 1 || !/[A-Z]/.test(guess)) {
                document.getElementById('message').textContent = 'Please enter a single letter.';
                return;
            }

            if (guessedLetters.includes(guess)) {
                document.getElementById('message').textContent = 'You already guessed that letter.';
                return;
            }

            guessedLetters.push(guess);

            if (!word.includes(guess)) {
                remainingGuesses--;
            }

            updateDisplay();

            // Check win/lose conditions
            if (remainingGuesses === 0) {
                document.getElementById('message').textContent = `Game Over! The word was ${word}`;
                setTimeout(initializeGame, 3000);
            } else if (!word.split('').some(letter => !guessedLetters.includes(letter))) {
                document.getElementById('message').textContent = 'Congratulations! You won!';
                setTimeout(initializeGame, 3000);
            }
        }

        // Handle Enter key
        document.getElementById('guess-input').addEventListener('keyup', function (event) {
            if (event.key === 'Enter') {
                makeGuess();
            }
        });

        // Start the game
        initializeGame();
    </script>
</body>

</html>
