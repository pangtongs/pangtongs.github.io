<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winston Andersen</title>
    <meta name="description" content="Winston Andersen, Lead Software Engineer in Singapore building treasury and payments infrastructure.">
    <meta name="author" content="Winston Andersen">
    <link rel="icon" href="../images/avatar.jpeg">
    <style>
        :root {
            --bg: #f7f5f0;
            --panel: #ffffff;
            --line: rgba(20, 24, 33, 0.1);
            --text: #161a22;
            --muted: #5d6675;
            --accent: #0f766e;
            --accent-soft: rgba(15, 118, 110, 0.1);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0d12;
                --panel: #13171f;
                --line: rgba(255, 255, 255, 0.09);
                --text: #eef1f6;
                --muted: #8d96a7;
                --accent: #5eead4;
                --accent-soft: rgba(94, 234, 212, 0.1);
                color-scheme: dark;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font: 16px/1.6 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 56px 20px 72px;
            display: flex;
            flex-direction: column;
            gap: 52px;
        }

        /* ---------- Intro ---------- */

        .intro {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .who {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .who img {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--line);
        }

        h1 {
            font-size: clamp(30px, 6vw, 42px);
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .who p {
            color: var(--muted);
            margin-top: 4px;
        }

        .summary {
            font-size: 18px;
            max-width: 62ch;
            text-wrap: pretty;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .links a {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--panel);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: border-color 0.15s, color 0.15s;
        }

        .links a:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ---------- Sections ---------- */

        h2 {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 18px;
        }

        .group + .group {
            margin-top: 28px;
        }

        .group h3 {
            font-size: 19px;
            letter-spacing: -0.01em;
        }

        .entries {
            margin-top: 10px;
            border-left: 2px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .entry {
            position: relative;
            padding-left: 18px;
        }

        .entry::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 9px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--bg);
            border: 2px solid var(--accent);
        }

        .entry-head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            column-gap: 16px;
        }

        .entry-head b {
            font-weight: 600;
        }

        .entry-head span {
            color: var(--muted);
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .entry ul {
            margin-top: 6px;
            padding-left: 18px;
            color: var(--muted);
            font-size: 15px;
        }

        .entry li + li {
            margin-top: 4px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
        }

        .chips li {
            padding: 6px 12px;
            border-radius: 8px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 14px;
            font-weight: 600;
        }

        .two {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 36px;
        }

        .project {
            display: block;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: var(--panel);
            text-decoration: none;
            transition: border-color 0.15s, transform 0.15s;
        }

        .project:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .project b {
            font-size: 17px;
        }

        .project p {
            color: var(--muted);
            font-size: 15px;
        }

        footer {
            color: var(--muted);
            font-size: 13px;
            border-top: 1px solid var(--line);
            padding-top: 18px;
        }

        @media print {
            .links,
            #projects {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <header class="intro">
            <div class="who">
                <img src="../images/avatar.jpeg" alt="">
                <div>
                    <h1 id="name">Winston Andersen</h1>
                    <p id="tagline"></p>
                </div>
            </div>
            <p class="summary" id="summary"></p>
            <nav class="links" aria-label="Profiles">
                <a id="linkedin" href="https://www.linkedin.com/in/winston-andersen/" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://github.com/pangtongs" target="_blank" rel="noopener">GitHub</a>
                <a href="https://medium.com/@winston_56087" target="_blank" rel="noopener">Medium</a>
                <a href="https://stackoverflow.com/users/4114089/wanda" target="_blank" rel="noopener">Stack Overflow</a>
                <a href="../index.html">All links</a>
            </nav>
        </header>

        <section aria-labelledby="h-exp">
            <h2 id="h-exp">Experience</h2>
            <div id="experience"></div>
        </section>

        <section aria-labelledby="h-edu">
            <h2 id="h-edu">Education</h2>
            <div id="education"></div>
        </section>

        <div class="two">
            <section aria-labelledby="h-skills">
                <h2 id="h-skills">Skills</h2>
                <ul class="chips" id="skills"></ul>
            </section>
            <section aria-labelledby="h-lang">
                <h2 id="h-lang">Languages</h2>
                <ul class="chips" id="languages"></ul>
            </section>
        </div>

        <section id="projects" aria-labelledby="h-proj">
            <h2 id="h-proj">Side projects</h2>
            <a class="project" href="../site/index.html">
                <b>🕹️ Winston's Arcade</b>
                <p>Seven small browser games: 2048, Snake, Flappy Bird, Sudoku, Memory, Hangman and Slots.</p>
            </a>
        </section>

        <footer id="footer"></footer>
    </main>

    <script src="profile.js"></script>
    <script>
        // profile.js is generated by build.py; everything below only lays it out.
        const P = window.PROFILE;
        const $ = id => document.getElementById(id);
        const el = (tag, text, cls) => {
            const node = document.createElement(tag);
            if (text) node.textContent = text;
            if (cls) node.className = cls;
            return node;
        };

        function renderGroups(target, groups) {
            for (const g of groups) {
                const group = el('div', '', 'group');
                group.append(el('h3', g.name));
                const entries = el('div', '', 'entries');
                for (const e of g.entries) {
                    const entry = el('div', '', 'entry');
                    const head = el('div', '', 'entry-head');
                    head.append(el('b', e.title), el('span', e.dates));
                    entry.append(head);
                    if (e.bullets.length) {
                        const ul = el('ul');
                        e.bullets.forEach(b => ul.append(el('li', b)));
                        entry.append(ul);
                    }
                    entries.append(entry);
                }
                group.append(entries);
                target.append(group);
            }
        }

        document.title = P.name;
        $('name').textContent = P.name;
        $('tagline').textContent = `${P.headline} · ${P.location}`;
        $('summary').textContent = P.summary;
        if (P.linkedin) $('linkedin').href = P.linkedin;
        renderGroups($('experience'), P.experience);
        renderGroups($('education'), P.education);
        P.skills.forEach(s => $('skills').append(el('li', s)));
        P.languages.forEach(s => $('languages').append(el('li', s)));
        $('footer').textContent = `Last updated ${new Date(P.updated).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`;
    </script>
</body>

</html>
